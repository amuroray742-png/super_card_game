# 静态站点 + API 反向代理（roadmap P1-3）。
#
# 厂商中立：这份配置只依赖 nginx 的标准模块，不依赖任何特定云厂商的语法。
# 放在容器里（compose 的 web 服务）或直接装在宿主机上都可用。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 压缩 ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 静态资源 ───────────────────────────────────────────
    # Vite 产物带内容哈希 → 可以长期强缓存
    # ⚠ 用 `^~` 而不是普通前缀：普通前缀会被下面的「图片正则」抢走
    #   （/assets/ 里的 svg 会掉到 30 天缓存那一档）。
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 卡面 / 遗物图标等 public 资源（文件名不带哈希，给一个中等缓存）
    location ~* \.(svg|png|webp|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html 绝不能缓存：里面挂着前端构建的版本号，
    # 缓存住会让玩家一直拿到旧壳。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── API 反向代理 ───────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 存档导出串可能比较大（存档上限见 core/config/save-import.ts）
        client_max_body_size 8m;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── SPA 回退 ───────────────────────────────────────────
    # 前端用的是 hash 路由（/#/forge），理论上不会命中未知路径；
    # 保留回退是为了将来改成 history 路由时不至于 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS ──────────────────────────────────────────────────
# 厂商中立的做法：**TLS 终止在反向代理这一层**，证书与续期交给
# 任意一个 ACME 客户端（certbot / acme.sh / 云厂商的证书服务）。
# 证书文件挂进来后，把下面这段 server 打开、把上面的 80 端口段改成：
#
#   server {
#       listen 80;
#       server_name game.example.com;
#       location /.well-known/acme-challenge/ { root /var/www/certbot; }
#       location / { return 301 https://$host$request_uri; }
#   }
#
#   server {
#       listen 443 ssl;
#       http2 on;
#       server_name game.example.com;
#
#       ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
#       ssl_protocols TLSv1.2 TLSv1.3;
#       ssl_prefer_server_ciphers off;
#
#       # 其余 location 与上面一致
#   }
#
# ⚠ 开启 HTTPS 后，前端的 API 地址仍是相对路径 `/api` → 同源，无需 CORS。
