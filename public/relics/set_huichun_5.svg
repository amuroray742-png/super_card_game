<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="素纱腕带图标">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#3A3A44"/>
      <stop offset="100%" stop-color="#232329"/>
    </radialGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <rect width="7" height="14" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
    <clipPath id="disc">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <!-- 底盘 -->
  <circle cx="64" cy="64" r="58" fill="url(#bg)"/>
  <g clip-path="url(#disc)">
    <rect width="128" height="128" fill="url(#stripes)" transform="translate(38 0)"/>
  </g>

  <!-- 套装内圈：细描边 + 淡色晕，让套装归属一眼可辨 -->
  <circle cx="64" cy="64" r="44" fill="#7FD08A" fill-opacity="0.12"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#7FD08A" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- 中央套装符号（上移，让位给底部的主词条小徽） -->
  <g transform="translate(31 20)" fill="#7FD08A" fill-opacity="0.95" fill-rule="evenodd">
    <path d="M32 58 L32 34 M32 34 C32 22 22 16 12 18 C14 30 22 36 32 36 Z M32 34 C32 24 40 18 50 20 C48 30 40 36 32 36 Z"/>
  </g>

  <!-- 主词条小徽（底部） -->
  <g transform="translate(47 82)">
    <circle cx="17" cy="17" r="17" fill="#000000" fill-opacity="0.55" stroke="#A8A8B3" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(3.4 3.4) scale(0.9)" fill="#EDEDF2" fill-opacity="0.96" fill-rule="evenodd">
      <path d="M16 29 C4 21 3 13 8 8 C13 3 18 6 16 11 C14 6 19 3 24 8 C29 13 28 21 16 29 Z"/>
    </g>
  </g>

  <!-- 外环装饰点 -->
  <circle cx="37.0" cy="17.2" r="2.8" fill="#A8A8B3" fill-opacity="0.8"/><circle cx="91.0" cy="17.2" r="2" fill="#A8A8B3" fill-opacity="0.65"/><circle cx="64.0" cy="10.0" r="2" fill="#A8A8B3" fill-opacity="0.5"/>

  <!-- 稀有度外环 -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#A8A8B3" stroke-width="2" stroke-opacity="0.9"/>

  <!-- 稀有度角标 -->
  <g transform="translate(92 30)">
    <circle r="16" fill="#000000" fill-opacity="0.62" stroke="#A8A8B3" stroke-opacity="0.85" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="16" fill="#EDEDF2">N</text>
  </g>
</svg>
