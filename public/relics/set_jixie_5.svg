<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="铜制小件图标">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#3A3A44"/>
      <stop offset="100%" stop-color="#232329"/>
    </radialGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
      <rect width="7" height="14" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
    <clipPath id="disc">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <!-- 底盘 -->
  <circle cx="64" cy="64" r="58" fill="url(#bg)"/>
  <g clip-path="url(#disc)">
    <rect width="128" height="128" fill="url(#stripes)" transform="translate(5 0)"/>
  </g>

  <!-- 套装内圈：细描边 + 淡色晕，让套装归属一眼可辨 -->
  <circle cx="64" cy="64" r="44" fill="#E8964A" fill-opacity="0.12"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#E8964A" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- 中央套装符号（上移，让位给底部的主词条小徽） -->
  <g transform="translate(31 20)" fill="#E8964A" fill-opacity="0.95" fill-rule="evenodd">
    <path d="M32 8 L38 8 L39 15 L45 13 L50 17 L47 23 L54 25 L54 31 L47 32 L50 38 L45 42 L39 40 L38 47 L32 47 L31 40 L25 42 L20 38 L23 32 L16 31 L16 25 L23 24 L20 18 L25 13 L31 15 Z M32 22 A10 10 0 1 0 32.1 22 Z"/>
  </g>

  <!-- 主词条小徽（底部） -->
  <g transform="translate(47 82)">
    <circle cx="17" cy="17" r="17" fill="#000000" fill-opacity="0.55" stroke="#A8A8B3" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(3.4 3.4) scale(0.9)" fill="#EDEDF2" fill-opacity="0.96" fill-rule="evenodd">
      <path d="M6 4 L26 28 L20 30 L4 12 Z M26 4 L6 28 L12 30 L28 12 Z"/>
    </g>
  </g>

  <!-- 外环装饰点 -->
  <circle cx="64.0" cy="118.0" r="2.8" fill="#A8A8B3" fill-opacity="0.8"/><circle cx="17.2" cy="91.0" r="2" fill="#A8A8B3" fill-opacity="0.65"/><circle cx="37.0" cy="110.8" r="2" fill="#A8A8B3" fill-opacity="0.5"/>

  <!-- 稀有度外环 -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#A8A8B3" stroke-width="2" stroke-opacity="0.9"/>

  <!-- 稀有度角标 -->
  <g transform="translate(92 30)">
    <circle r="16" fill="#000000" fill-opacity="0.62" stroke="#A8A8B3" stroke-opacity="0.85" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="16" fill="#EDEDF2">N</text>
  </g>
</svg>
