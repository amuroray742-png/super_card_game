<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="五行佩图标">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#2F4A72"/>
      <stop offset="100%" stop-color="#17293F"/>
    </radialGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(86)">
      <rect width="7" height="14" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
    <clipPath id="disc">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <!-- 底盘 -->
  <circle cx="64" cy="64" r="58" fill="url(#bg)"/>
  <g clip-path="url(#disc)">
    <rect width="128" height="128" fill="url(#stripes)" transform="translate(16 0)"/>
  </g>

  <!-- 套装内圈：细描边 + 淡色晕，让套装归属一眼可辨 -->
  <circle cx="64" cy="64" r="44" fill="#E2C25A" fill-opacity="0.12"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#E2C25A" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- 中央套装符号（上移，让位给底部的主词条小徽） -->
  <g transform="translate(31 20)" fill="#E2C25A" fill-opacity="0.95" fill-rule="evenodd">
    <path d="M32 8 L54 20 L54 44 L32 56 L10 44 L10 20 Z M32 18 L22 24 L22 38 L32 44 L42 38 L42 24 Z"/>
  </g>

  <!-- 主词条小徽（底部） -->
  <g transform="translate(47 82)">
    <circle cx="17" cy="17" r="17" fill="#000000" fill-opacity="0.55" stroke="#A8CBF2" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(3.4 3.4) scale(0.9)" fill="#EAF3FF" fill-opacity="0.96" fill-rule="evenodd">
      <path d="M6 4 L26 28 L20 30 L4 12 Z M26 4 L6 28 L12 30 L28 12 Z"/>
    </g>
  </g>

  <!-- 外环装饰点 -->
  <circle cx="91.0" cy="17.2" r="2.8" fill="#A8CBF2" fill-opacity="0.8"/><circle cx="110.8" cy="37.0" r="2" fill="#A8CBF2" fill-opacity="0.65"/><circle cx="110.8" cy="37.0" r="2" fill="#A8CBF2" fill-opacity="0.5"/>

  <!-- 稀有度外环 -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#A8CBF2" stroke-width="4" stroke-opacity="0.9"/>

  <!-- 稀有度角标 -->
  <g transform="translate(92 30)">
    <circle r="16" fill="#000000" fill-opacity="0.62" stroke="#A8CBF2" stroke-opacity="0.85" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="13" fill="#EAF3FF">SR</text>
  </g>
</svg>
