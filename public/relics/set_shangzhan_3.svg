<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="砺石佩剑图标">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#2E5A49"/>
      <stop offset="100%" stop-color="#16302A"/>
    </radialGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(26)">
      <rect width="7" height="14" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
    <clipPath id="disc">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <!-- 底盘 -->
  <circle cx="64" cy="64" r="58" fill="url(#bg)"/>
  <g clip-path="url(#disc)">
    <rect width="128" height="128" fill="url(#stripes)" transform="translate(26 0)"/>
  </g>

  <!-- 套装内圈：细描边 + 淡色晕，让套装归属一眼可辨 -->
  <circle cx="64" cy="64" r="44" fill="#9AA6BC" fill-opacity="0.12"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#9AA6BC" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- 中央套装符号（上移，让位给底部的主词条小徽） -->
  <g transform="translate(31 20)" fill="#9AA6BC" fill-opacity="0.95" fill-rule="evenodd">
    <path d="M26 10 L38 10 L38 26 L54 26 L54 38 L38 38 L38 54 L26 54 L26 38 L10 38 L10 26 L26 26 Z"/>
  </g>

  <!-- 主词条小徽（底部） -->
  <g transform="translate(47 82)">
    <circle cx="17" cy="17" r="17" fill="#000000" fill-opacity="0.55" stroke="#8FD6AE" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(3.4 3.4) scale(0.9)" fill="#E6FFF2" fill-opacity="0.96" fill-rule="evenodd">
      <path d="M6 4 L26 28 L20 30 L4 12 Z M26 4 L6 28 L12 30 L28 12 Z"/>
    </g>
  </g>

  <!-- 外环装饰点 -->
  <circle cx="37.0" cy="110.8" r="2.8" fill="#8FD6AE" fill-opacity="0.8"/><circle cx="91.0" cy="17.2" r="2" fill="#8FD6AE" fill-opacity="0.65"/><circle cx="64.0" cy="118.0" r="2" fill="#8FD6AE" fill-opacity="0.5"/>

  <!-- 稀有度外环 -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#8FD6AE" stroke-width="3" stroke-opacity="0.9"/>

  <!-- 稀有度角标 -->
  <g transform="translate(92 30)">
    <circle r="16" fill="#000000" fill-opacity="0.62" stroke="#8FD6AE" stroke-opacity="0.85" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="16" fill="#E6FFF2">R</text>
  </g>
</svg>
