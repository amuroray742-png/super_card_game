<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="青冥羽衣图标">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#6B4A18"/>
      <stop offset="100%" stop-color="#3A2A12"/>
    </radialGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(10)">
      <rect width="7" height="14" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
    <clipPath id="disc">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <!-- 底盘 -->
  <circle cx="64" cy="64" r="58" fill="url(#bg)"/>
  <g clip-path="url(#disc)">
    <rect width="128" height="128" fill="url(#stripes)" transform="translate(0 0)"/>
  </g>

  <!-- 套装内圈：细描边 + 淡色晕，让套装归属一眼可辨 -->
  <circle cx="64" cy="64" r="44" fill="#A8E86A" fill-opacity="0.12"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#A8E86A" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- 中央套装符号（上移，让位给底部的主词条小徽） -->
  <g transform="translate(31 20)" fill="#A8E86A" fill-opacity="0.95" fill-rule="evenodd">
    <path d="M12 52 L26 14 L32 30 L38 12 L54 50 L32 40 Z M26 14 L32 30 M38 12 L32 30"/>
  </g>

  <!-- 主词条小徽（底部） -->
  <g transform="translate(47 82)">
    <circle cx="17" cy="17" r="17" fill="#000000" fill-opacity="0.55" stroke="#F0D089" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(3.4 3.4) scale(0.9)" fill="#FFF6DC" fill-opacity="0.96" fill-rule="evenodd">
      <path d="M3 12 L16 12 L13 5 L26 14 L13 23 L16 16 L3 16 Z M20 22 L29 22 L27 17 L34 23 L27 29 L29 24 L20 24 Z"/>
    </g>
  </g>

  <!-- 外环装饰点 -->
  <circle cx="10.0" cy="64.0" r="2.8" fill="#F0D089" fill-opacity="0.8"/><circle cx="64.0" cy="10.0" r="2" fill="#F0D089" fill-opacity="0.65"/><circle cx="17.2" cy="37.0" r="2" fill="#F0D089" fill-opacity="0.5"/>

  <!-- 稀有度外环 -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#F0D089" stroke-width="5" stroke-opacity="0.9"/>

  <!-- 稀有度角标 -->
  <g transform="translate(92 30)">
    <circle r="16" fill="#000000" fill-opacity="0.62" stroke="#F0D089" stroke-opacity="0.85" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="11" fill="#FFF6DC">SSR</text>
  </g>
</svg>
