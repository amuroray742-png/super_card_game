<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="曹大家占位头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26262B"/>
      <stop offset="100%" stop-color="#43434C"/>
    </linearGradient>
    <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="13" height="26" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#52BE80" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#52BE80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#stripes)" transform="translate(35 0)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 装饰同心环 -->
  <circle cx="256" cy="238" r="196" fill="none" stroke="#A8A8B3" stroke-opacity="0.32" stroke-width="2"/>

  <!-- 五行中心符号 -->
  <g transform="translate(0 -14)" fill="#A8A8B3" fill-opacity="0.92" fill-rule="evenodd">
    <path d="M256 104 L286 208 L256 240 L226 208 Z M170 268 L342 268 L342 300 L170 300 Z M186 316 L326 316 L326 344 L186 344 Z M186 372 L326 372 L326 400 L186 400 Z"/>
  </g>

  <!-- 五行角标 -->
  <g transform="translate(404 60)">
    <circle r="40" fill="#000000" fill-opacity="0.34" stroke="#A8A8B3" stroke-opacity="0.5" stroke-width="2"/>
    <text y="13" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="38" fill="#EDEDF2">木</text>
  </g>

  <!-- 定位角标 -->
  <g transform="translate(38 300)" fill="#4E8FA8" fill-opacity="0.9">
    <path d="M40 348 L64 320 L88 348 L64 376 Z"/>
  </g>

  <!-- 稀有度边框 -->
  <rect x="6" y="6" width="500" height="500" rx="26" fill="none" stroke="#A8A8B3" stroke-width="2" stroke-opacity="0.85"/>

  <!-- 名牌 -->
  <rect x="0" y="424" width="512" height="88" fill="#000000" fill-opacity="0.5"/>
  <text x="256" y="482" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="46" fill="#EDEDF2">曹大家</text>
</svg>
