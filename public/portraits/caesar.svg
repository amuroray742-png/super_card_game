<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="凯撒占位头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1C3D"/>
      <stop offset="100%" stop-color="#5A2E52"/>
    </linearGradient>
    <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(48)">
      <rect width="13" height="26" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#B7950B" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#B7950B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#stripes)" transform="translate(18 0)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 装饰同心环 -->
  <circle cx="256" cy="238" r="196" fill="none" stroke="#E8C87A" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="256" cy="238" r="162" fill="none" stroke="#E8C87A" stroke-opacity="0.23" stroke-width="2"/>

  <!-- 五行中心符号 -->
  <g transform="translate(0 -14)" fill="#E8C87A" fill-opacity="0.92" fill-rule="evenodd">
    <path d="M256 96 L330 236 L256 416 L182 236 Z M256 176 L296 236 L256 296 L216 236 Z"/>
  </g>

  <!-- 五行角标 -->
  <g transform="translate(404 60)">
    <circle r="40" fill="#000000" fill-opacity="0.34" stroke="#E8C87A" stroke-opacity="0.5" stroke-width="2"/>
    <text y="13" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="38" fill="#FFF4D6">金</text>
  </g>

  <!-- 定位角标 -->
  <g transform="translate(38 300)" fill="#C8A951" fill-opacity="0.9">
    <path d="M40 336 L104 336 L104 368 L40 368 Z"/>
  </g>

  <!-- 稀有度边框 -->
  <rect x="6" y="6" width="500" height="500" rx="26" fill="none" stroke="#E8C87A" stroke-width="8" stroke-opacity="0.85"/>

  <!-- 名牌 -->
  <rect x="0" y="424" width="512" height="88" fill="#000000" fill-opacity="0.5"/>
  <text x="256" y="482" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="46" fill="#FFF4D6">凯撒</text>
</svg>
